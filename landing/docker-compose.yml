services:
  landing:
    image: halverneus/static-file-server:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      FOLDER: /web
    volumes:
      - ./:/web:ro
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
